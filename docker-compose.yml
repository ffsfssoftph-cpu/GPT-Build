services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caresuite
      POSTGRES_USER: caresuite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set-in-.env}
    volumes: [care-suite-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caresuite -d caresuite"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://caresuite:${POSTGRES_PASSWORD}@database:5432/caresuite
    depends_on:
      database: { condition: service_healthy }
    ports: ["3000:3000"]
    restart: unless-stopped
volumes:
  care-suite-data:
